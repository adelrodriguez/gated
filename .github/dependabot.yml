version: 2
updates:
  # Dependabot does not support pnpm 12. Update package dependencies with
  # `pnpm run bump:deps` until support is available.
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    assignees:
      - "adelrodriguez"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
    groups:
      all-github-actions:
        patterns:
          - "*"
