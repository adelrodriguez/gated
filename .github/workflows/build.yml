name: build

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["test"]
    branches: [main]
    types:
      - completed

# Only runs that will do work share the group, so a skipped stale
# workflow_run cannot cancel or replace the run for the current commit.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)) && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build
        run: pnpm run build:verify

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/react/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install example dependencies
        run: pnpm --dir examples/react install --frozen-lockfile

      - name: Type-check example
        run: pnpm --dir examples/react run typecheck

      - name: Build example
        run: pnpm --dir examples/react run build
